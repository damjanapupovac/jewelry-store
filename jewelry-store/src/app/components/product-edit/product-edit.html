<div
  class="min-vh-100 d-flex align-items-center justify-content-center"
  style="
    background-image: url('assets/img/background.png');
    background-repeat: repeat;
    background-size: 100px 100px;
    background-position: center;
    z-index: 0;
    position: relative;
  "
>
  <div class="card shadow-lg border-radius-xl p-4" style="width: 100%; max-width: 1000px; background-color: white; z-index: 1;">
    <div class="card-header text-center bg-transparent mb-4">
      <h3 class="font-weight-bolder text-pink text-gradient">Edit Product</h3>
      <p class="mb-0">Update the product details below</p>
    </div>

    <app-product-form
      [product]="product"
      (submitProduct)="handleSubmit($event)"
    ></app-product-form>
  </div>
</div>
