<h2>Lista proizvoda</h2>

<a routerLink="/add">Add new product</a>

<ul *ngIf="products.length > 0; else noProducts">
  <li *ngFor="let product of products">
    {{ product.name }} - {{ product.price }} RSD
  </li>
</ul>

<ng-template #noProducts>
  <p style="font-style: italic; color: gray;">No products to show.</p>
</ng-template>
