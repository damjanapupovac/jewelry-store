<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>List of products</h2>
    <a routerLink="/add" class="btn btn-success">Add new product</a>
  </div>

  <div *ngIf="products.length > 0; else noProducts">
    <div class="row">
      <div class="col-md-4 mb-4" *ngFor="let product of products">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.description }}</p>
            <p class="card-text"><strong>Price:</strong> {{ product.price | currency }}</p>
            <p class="card-text"><strong>Category:</strong> {{ product.category }}</p>
          </div>
          <div class="card-footer d-flex justify-content-between">
            <a [routerLink]="['/products', product.id]" class="btn btn-primary">Details</a>
            <a [routerLink]="['/edit', product.id]" class="btn btn-warning">Edit</a>
            <button class="btn btn-danger" (click)="deleteProduct(product.id)">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noProducts>
    <div class="alert alert-info text-center">
      <em style="color: gray;">No products to show.</em>
    </div>
  </ng-template>
</div>
