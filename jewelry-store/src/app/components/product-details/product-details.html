<div
  class="min-vh-100 d-flex align-items-center justify-content-center"
  style="
    background-image: url('assets/img/background.png');
    background-repeat: repeat;
    background-size: 100px 100px;
    background-position: center;
    z-index: 0;
    position: relative;
  "
>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card card-plain shadow-lg border-radius-lg p-4" style="background-color: white;">
          <div *ngIf="product; else loading">
            <div class="text-center mb-4">
              <img
                [src]="product.imageUrl || 'assets/img/background.png'"
                alt="{{ product.name }}"
                class="img-fluid rounded"
                style="max-height: 300px;"
              />
            </div>

            <h3 class="text-pink text-gradient text-center">{{ product.name }}</h3>
            <p class="text-center text-muted">{{ product.description }}</p>

            <hr />

            <div class="mt-4">
              <h5 class="text-pink">Comments</h5>

              <div *ngIf="comments.length === 0" class="text-muted">No comments yet.</div>

              <div *ngFor="let c of comments" class="comment-box mb-3 p-3 border rounded">
                <strong>{{ c.userName || 'Anonymous' }}</strong>
                <span class="text-muted">({{ c.createdAt | date:'short' }})</span>
                <p class="mt-2 mb-0">{{ c.text }}</p>
              </div>

              <div *ngIf="isLoggedIn" class="mt-3">
                <textarea [(ngModel)]="newCommentText" rows="3" class="form-control" placeholder="Write a comment..."></textarea>
                <button class="btn btn-pink-gradient mt-2" (click)="submitComment()">Add Comment</button>
              </div>
            </div>


            <div class="d-flex justify-content-between">
              <span><strong>Category:</strong> {{ product.category }}</span>
              <span><strong>Price:</strong> {{ product.price | currency }}</span>
            </div>
          </div>

          <ng-template #loading>
            <p class="text-center text-muted">Loading product details...</p>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
