<form (ngSubmit)="onSubmit()" #form="ngForm">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" id="name" class="form-control" [(ngModel)]="product.name" name="name" required minlength="3" #name="ngModel">
    <div *ngIf="name.invalid && name.touched" class="text-danger mt-1">
      <div *ngIf="name.errors?.['required']">Name is required.</div>
      <div *ngIf="name.errors?.['minlength']">Name must be at least 3 characters long.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea id="description" class="form-control" [(ngModel)]="product.description" name="description" required minlength="5" #description="ngModel"></textarea>
    <div *ngIf="name.invalid && name.touched" class="text-danger mt-1">
      <div *ngIf="name.errors?.['required']">Description is required.</div>
      <div *ngIf="name.errors?.['minlength']">Description must be at least 5 characters long.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="price" class="form-label">Price</label>
    <input type="number" id="price" class="form-control" [(ngModel)]="product.price" name="price" required min="1" #price="ngModel">
    <div *ngIf="price.invalid && price.touched" class="text-danger mt-1">
      <div *ngIf="price.errors?.['required']">Price is required.</div>
      <div *ngIf="price.errors?.['min']">Price must be greater than 0.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="category" class="form-label">Category</label>
    <input type="text" id="category" class="form-control" [(ngModel)]="product.category" name="category" required minlength="3" #category="ngModel">
    <div *ngIf="name.invalid && name.touched" class="text-danger mt-1">
      <div *ngIf="name.errors?.['required']">Category is required.</div>
      <div *ngIf="name.errors?.['minlength']">Category must be at least 3 characters long.</div>
    </div>
  </div>

  <button type="submit" class="btn btn-success" [disabled]="form.invalid">Save</button>
</form>
