<header class="position-sticky top-0 z-index-sticky">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <nav class="navbar navbar-expand-lg shadow border-radius-xl mt-3 py-2 px-4 bg-ff69b4">
          <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" routerLink="/" (click)="toggleLogo($event)">
            <img
              [src]="logoSrc"
              alt="Jewelry Store Logo"
              style="height: 70px; object-fit: contain;"
            />
            </a>

            <!-- Toggler -->
            <button
              class="navbar-toggler shadow-none ms-2"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navLinks"
              aria-controls="navLinks"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon mt-2">
                <span class="navbar-toggler-bar bar1"></span>
                <span class="navbar-toggler-bar bar2"></span>
                <span class="navbar-toggler-bar bar3"></span>
              </span>
            </button>

            <!-- Links -->
            <div class="collapse navbar-collapse" id="navLinks">
              <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item">
                  <a class="nav-link" routerLink="/">
                    <i class="fa fa-gem me-1 opacity-6"></i> Products
                  </a>
                </li>

                <li class="nav-item" *ngIf="auth.isAdmin()">
                  <a class="nav-link" routerLink="/add">
                    <i class="fa fa-plus me-1 opacity-6"></i> Add
                  </a>
                </li>

                <li class="nav-item position-relative" *ngIf="auth.isUser()">
                  <a class="nav-link" routerLink="/cart">
                    <i class="fa fa-shopping-cart me-1 opacity-6"></i> Cart
                    <span
                      *ngIf="cartCount > 0"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-pink"
                      style="font-size: 0.7rem;"
                    >
                      {{ cartCount }}
                    </span>
                  </a>
                </li>
              </ul>

              <ul class="navbar-nav ms-auto">
                <li class="nav-item" *ngIf="!auth.isLoggedIn()">
                  <a class="nav-link" routerLink="/login">
                    <i class="fas fa-sign-in-alt me-1 opacity-6"></i>Login
                  </a>
                </li>
                <li class="nav-item" *ngIf="!auth.isLoggedIn()">
                  <a class="nav-link" routerLink="/register">
                    <i class="fas fa-user-plus me-1 opacity-6"></i> Register
                  </a>
                </li>
                <li class="nav-item" *ngIf="auth.isLoggedIn()">
                  <button class="btn btn-outline-pink btn-sm mb-0" (click)="logout()">
                    Logout
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </div>
</header>
